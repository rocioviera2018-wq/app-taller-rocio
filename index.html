<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechPro PRO</title>
<style>
:root { --bg: #050505; --card: #111113; --text: #FFF; --sub: #888; --prim: #FF2A55; --neon: #00E5FF; --bor: #222; }
[data-theme="claro-rojo"] { --bg: #F8FAFC; --card: #FFF; --text: #0F172A; --sub: #64748B; --prim: #DC2626; --neon: #DC2626; --bor: #E2E8F0; }
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:80px}
.hidden{display:none!important}
#login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:20px;text-align:center}
.btn-google{background:#FFF;color:#000;border:none;padding:12px 20px;border-radius:10px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:300px;margin-top:20px;cursor:pointer}
.header{padding:16px;display:flex;justify-content:space-between;align-items:center}
.user-info{display:flex;gap:12px;align-items:center}
/* LOGO MÁS GRANDE AQUÍ */
.avatar{width:64px;height:64px;border-radius:50%;background:var(--card);border:3px solid var(--neon);display:flex;align-items:center;justify-content:center;font-size:28px;background-size:cover;background-position:center}
.greeting h2{font-size:18px;font-weight:700}
.greeting p{font-size:12px;color:var(--sub)}
.icon-btn{background:var(--card);border:1px solid var(--bor);color:var(--text);width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer}
.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px;margin-bottom:20px}
.stat-box{background:var(--card);padding:16px;border-radius:12px;border:1px solid var(--bor);text-align:center}
.stat-val{font-size:22px;font-weight:700;color:var(--neon)}
.stat-lab{font-size:11px;color:var(--sub);margin-top:4px;font-weight:600}
.section-title{font-size:15px;color:var(--sub);padding:0 16px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);margin:0 16px 12px;padding:16px;border-radius:12px;border:1px solid var(--bor)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.card-title{font-weight:700;font-size:15px}
.badge{padding:4px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;background:rgba(255,42,85,0.15);color:var(--prim)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bor);display:flex;justify-content:space-around;padding:12px 0 24px;z-index:100}
.nav-btn{background:none;border:none;color:var(--sub);display:flex;flex-direction:column;align-items:center;font-size:22px;gap:4px;cursor:pointer;flex:1}
.nav-btn span{font-size:10px;font-weight:600}
.nav-btn.active{color:var(--neon)}
.view{display:none;padding-top:10px}
.view.active{display:block}
.btn-main{background:var(--prim);color:#FFF;border:none;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}
.btn-pdf{background:#10B981;color:#FFF;border:none;padding:6px 10px;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);backdrop-filter:blur(5px);z-index:200;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.modal-cnt{background:var(--card);width:100%;max-width:600px;padding:24px;border-radius:24px 24px 0 0;border-top:2px solid var(--neon)}
.modal-cnt h3{margin-bottom:15px;color:var(--neon)}
.modal-cnt input, .modal-cnt select {width:100%;padding:14px;border:1px solid var(--bor);border-radius:10px;margin-bottom:12px;background:var(--bg);color:var(--text);font-size:14px}
.modal-btns{display:flex;gap:10px;margin-top:10px}
.btn-cancel{background:transparent;color:var(--sub);border:1px solid var(--bor);padding:12px;border-radius:8px;flex:1}
.btn-save{background:var(--neon);color:#000;border:none;padding:12px;border-radius:8px;flex:1;font-weight:700}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.theme-opt{padding:12px;border-radius:8px;border:2px solid var(--bor);cursor:pointer;text-align:center;font-size:12px;font-weight:700}
</style>
</head>
<body>

<div id="login-screen">
  <h1 style="color:var(--neon);font-size:28px;text-shadow:0 0 20px rgba(0,229,255,0.4)">TechPro PRO</h1>
  <p style="color:var(--sub);margin-bottom:20px">Gestión Profesional de Taller</p>
  <button id="google-btn" class="btn-google">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20"> Entrar con Google
  </button>
</div>

<div id="app-screen" class="hidden">
  <div class="header">
    <div class="user-info">
      <div class="avatar" id="logoBox">🔧</div>
      <div class="greeting"><h2 id="hLocal">Mi Taller</h2><p id="hTec">Técnico</p></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="icon-btn" onclick="wa()">💬</button>
      <button class="icon-btn" onclick="logout()">🚪</button>
    </div>
  </div>

  <main id="view-inicio" class="view active">
    <div class="stats-row">
      <div class="stat-box"><div class="stat-val" id="sOrd">0</div><div class="stat-lab">Órdenes</div></div>
      <div class="stat-box"><div class="stat-val" id="sCli">0</div><div class="stat-lab">Clientes</div></div>
    </div>
    <div class="section-title">Últimos Movimientos</div>
    <div id="listHome"></div>
  </main>

  <main id="view-clientes" class="view">
    <div class="section-title">Clientes <button class="btn-main" onclick="openModal('mCli')">+ Nuevo</button></div>
    <div id="listCli"></div>
  </main>

  <main id="view-ordenes" class="view">
    <div class="section-title">Órdenes <button class="btn-main" onclick="openModal('mOrd')">+ Nueva</button></div>
    <div id="listOrd"></div>
  </main>

  <main id="view-ajustes" class="view">
    <div class="section-title">Datos del Local</div>
    <div class="card">
      <input type="text" id="inLoc" placeholder="Nombre del Local" style="width:100%;padding:12px;margin-bottom:10px;background:var(--bg);border:1px solid var(--bor);color:#fff;border-radius:8px">
      <input type="tel" id="inTel" placeholder="WhatsApp (549...)" style="width:100%;padding:12px;margin-bottom:10px;background:var(--bg);border:1px solid var(--bor);color:#fff;border-radius:8px">
      <label style="font-size:12px;color:var(--sub)">Subir Logo (Galería)</label>
      <input type="file" id="inFile" accept="image/*" onchange="subirLogo(event)" style="width:100%;padding:10px;color:var(--sub);margin-bottom:10px">
      <button class="btn-main" style="width:100%;padding:14px" onclick="saveConf()">Guardar Datos</button>
    </div>
    <div class="section-title">Tema de Colores</div>
    <div class="card">
      <div class="theme-grid">
        <div class="theme-opt" style="background:#050505;color:#00E5FF" onclick="setTheme('alerta-pro')">Negro/Cian</div>
        <div class="theme-opt" style="background:#F8FAFC;color:#DC2626" onclick="setTheme('claro-rojo')">Claro/Rojo</div>
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" onclick="nav('inicio', this)">🏠<span>Inicio</span></button>
    <button class="nav-btn" onclick="nav('clientes', this)">👥<span>Clientes</span></button>
    <button class="nav-btn" onclick="nav('ordenes', this)">📋<span>Órdenes</span></button>
    <button class="nav-btn" onclick="nav('ajustes', this)">⚙️<span>Ajustes</span></button>
  </nav>
</div>

<div id="mCli" class="modal"><div class="modal-cnt">
  <h3>Nuevo Cliente</h3>
  <input type="text" id="cNom" placeholder="Nombre completo">
  <input type="tel" id="cTel" placeholder="Teléfono / WhatsApp">
  <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('mCli')">Cancelar</button><button class="btn-save" onclick="addCli()">Guardar</button></div>
</div></div>

<div id="mOrd" class="modal"><div class="modal-cnt">
  <h3>Nueva Orden</h3>
  <select id="oCli"></select>
  <input type="text" id="oEq" placeholder="Equipo (Ej: iPhone 13)">
  <input type="number" id="oCos" placeholder="Costo">
  <div class="modal-btns"><button class="btn-cancel" onclick="closeModal('mOrd')">Cancelar</button><button class="btn-save" onclick="addOrd()">Guardar</button></div>
</div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, doc, getDocs, getDoc, setDoc, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD9RwHUv-6HnU0_0eaxMREm9Wm3abpOnUw",
  authDomain: "techpro-app-25cdf.firebaseapp.com",
  projectId: "techpro-app-25cdf",
  storageBucket: "techpro-app-25cdf.firebasestorage.app",
  messagingSenderId: "22400430612",
  appId: "1:22400430612:web:9a4d57de602d17bfd36d01"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let D = { config: { local: 'Mi Taller', tel: '', logo: '' }, clientes: [], ordenes: [] };
let uid = null;

document.getElementById('google-btn').onclick = () => signInWithPopup(auth, provider).catch(e => alert("Error: " + e.message));

onAuthStateChanged(auth, async (user) => {
  if (user) {
    uid = user.uid;
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('app-screen').classList.remove('hidden');
    document.getElementById('hTec').textContent = 'Hola, ' + (user.displayName ? user.displayName.split(' ')[0] : 'Técnico');
    await cargarDatos();
  } else {
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('app-screen').classList.add('hidden');
  }
});

function logout() { signOut(auth); }

async function cargarDatos() {
  try {
    const cfg = await getDoc(doc(db, 'config', uid));
    if (cfg.exists()) D.config = cfg.data();
    
    const allCli = (await getDocs(collection(db, 'clientes'))).docs.map(d => ({ id: d.id, ...d.data() }));
    D.clientes = allCli.filter(c => c.uid === uid);
    
    const allOrd = (await getDocs(collection(db, 'ordenes'))).docs.map(d => ({ id: d.id, ...d.data() }));
    D.ordenes = allOrd.filter(o => o.uid === uid);
    
    render();
  } catch(e) {
    console.error(e);
    alert("Error al cargar: " + e.message);
  }
}

window.nav = function(id, el) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + id).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

window.openModal = function(id){ document.getElementById(id).classList.add('active'); }
window.closeModal = function(id){ document.getElementById(id).classList.remove('active'); }

window.setTheme = function(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('theme', t);
}
setTheme(localStorage.getItem('theme') || 'alerta-pro');

window.subirLogo = function(e) {
  const r = new FileReader(); r.onload = ev => { D.config.logo = ev.target.result; render(); }; r.readAsDataURL(e.target.files[0]);
}

window.saveConf = async function() {
  D.config.local = document.getElementById('inLoc').value || 'Mi Taller';
  D.config.tel = document.getElementById('inTel').value;
  await setDoc(doc(db, 'config', uid), D.config, { merge: true });
  alert('Ajustes guardados con éxito');
  render();
}

window.addCli = async function() {
  const n = document.getElementById('cNom').value;
  if(!n) return alert('Falta el nombre');
  await addDoc(collection(db, 'clientes'), { nombre: n, tel: document.getElementById('cTel').value, uid });
  closeModal('mCli'); cargarDatos();
}

window.addOrd = async function() {
  const e = document.getElementById('oEq').value;
  if(!e) return alert('Falta el equipo');
  await addDoc(collection(db, 'ordenes'), { equipo: e, costo: parseFloat(document.getElementById('oCos').value)||0, cli: document.getElementById('oCli').value, estado: 'pendiente', uid });
  closeModal('mOrd'); cargarDatos();
}

window.wa = function() { if(D.config.tel) window.open('https://wa.me/' + D.config.tel.replace(/\D/g,'')); }

// NUEVA FUNCIÓN PDF
window.imprimirPDF = function(id) {
  const o = D.ordenes.find(x => x.id === id);
  if(!o) return;
  const c = D.clientes.find(x => x.id == o.cli);
  
  const win = window.open('', '_blank');
  const logoHtml = D.config.logo ? `<img src="${D.config.logo}" style="max-width:120px; margin-bottom:10px; border-radius:10px;">` : '';
  
  win.document.write(`
    <html><head><title>Recibo - ${o.equipo}</title>
    <style>
      body{font-family:system-ui,sans-serif; padding:30px; text-align:center; color:#000;}
      h2{margin:0; font-size:24px;}
      .box{border:2px solid #eee; padding:20px; margin-top:20px; text-align:left; border-radius:12px;}
      .total{font-size:24px; font-weight:bold; margin-top:20px; border-top:2px solid #000; padding-top:15px; text-align:center;}
    </style>
    </head><body>
      ${logoHtml}
      <h2>${D.config.local}</h2>
      <p style="color:#666;">WhatsApp: ${D.config.tel || ''}</p>
      <div class="box">
        <p><strong>Equipo:</strong> ${o.equipo}</p>
        <p><strong>Cliente:</strong> ${c ? c.nombre : 'Sin cliente'}</p>
        <p><strong>Estado:</strong> ${o.estado.toUpperCase()}</p>
        <div class="total">TOTAL: $${o.costo}</div>
      </div>
      <button onclick="window.print()" style="margin-top:30px; padding:12px 24px; background:#000; color:#fff; border:none; border-radius:8px; font-size:16px; cursor:pointer;">Imprimir / Guardar PDF</button>
    </body></html>
  `);
  win.document.close();
}

function render() {
  if(!uid) return;
  document.getElementById('hLocal').textContent = D.config.local;
  document.getElementById('inLoc').value = D.config.local;
  document.getElementById('inTel').value = D.config.tel || '';
  
  if(D.config.logo) {
    document.getElementById('logoBox').style.backgroundImage = `url(${D.config.logo})`;
    document.getElementById('logoBox').textContent = '';
  }

  document.getElementById('sCli').textContent = D.clientes.length;
  document.getElementById('sOrd').textContent = D.ordenes.length;
  
  let h = ''; D.ordenes.slice(-3).reverse().forEach(o => {
    h += `<div class="card"><div class="card-head"><span class="card-title">${o.equipo}</span><span class="badge">${o.estado}</span></div><div style="font-size:13px;color:var(--sub)">💵 $${o.costo}</div></div>`;
  });
  document.getElementById('listHome').innerHTML = h || '<p style="color:var(--sub);padding:0 16px;">No hay movimientos</p>';
  
  h = ''; D.clientes.forEach(c => {
    h += `<div class="card"><div class="card-head"><span class="card-title">${c.nombre}</span><button class="badge" style="background:var(--neon);color:#000" onclick="window.open('https://wa.me/${c.tel.replace(/\\D/g,'')}')">WA</button></div><div style="font-size:13px;color:var(--sub)">📞 ${c.tel}</div></div>`;
  });
  document.getElementById('listCli').innerHTML = h || '<p style="color:var(--sub);padding:0 16px;">No hay clientes</p>';
  
  h = ''; D.ordenes.forEach(o => {
    const c = D.clientes.find(x => x.id == o.cli);
    h += `<div class="card">
      <div class="card-head"><span class="card-title">${o.equipo}</span><span class="badge">${o.estado}</span></div>
      <div style="font-size:13px;color:var(--sub);margin-bottom:10px;">👤 ${c?c.nombre:'N/A'} | 💵 $${o.costo}</div>
      <button class="btn-pdf" onclick="imprimirPDF('${o.id}')">🖨️ Imprimir / PDF</button>
    </div>`;
  });
  document.getElementById('listOrd').innerHTML = h || '<p style="color:var(--sub);padding:0 16px;">No hay órdenes</p>';
  
  document.getElementById('oCli').innerHTML = D.clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
}
</script>
</body>
</html>
