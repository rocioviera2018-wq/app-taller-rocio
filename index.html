<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechPro Manager</title>
<style>
:root { --bg: #09090B; --card: #18181B; --text: #FAFAFA; --sub: #A1A1AA; --prim: #E11D48; --acc: #06B6D4; --bor: #27272A; }
[data-theme="claro-rojo"] { --bg: #F8FAFC; --card: #FFF; --text: #0F172A; --sub: #64748B; --prim: #DC2626; --acc: #DC2626; --bor: #E2E8F0; }
[data-theme="claro-turquesa"] { --bg: #F8FAFC; --card: #FFF; --text: #0F172A; --sub: #64748B; --prim: #DC2626; --acc: #0D9488; --bor: #E2E8F0; }
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:80px;transition:0.3s}
.header{background:var(--card);padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--bor)}
.btn-main{background:var(--prim);color:#FFF;border:none;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:12px 0 20px 0;border-top:1px solid var(--bor);z-index:100}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:20px;color:var(--sub);cursor:pointer;flex:1}
.nav-btn span{font-size:10px;margin-top:4px;font-weight:600}
.nav-btn.active{color:var(--acc)}
.view{display:none;padding:20px 16px;max-width:700px;margin:0 auto}
.view.active{display:block}
.card{background:var(--card);padding:16px;border-radius:12px;border:1px solid var(--bor);margin-bottom:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.modal-content{background:var(--card);width:100%;max-width:600px;padding:24px;border-radius:24px 24px 0 0}
.modal-content input, .modal-content select {width:100%;padding:14px;border:1px solid var(--bor);border-radius:10px;margin:8px 0 16px;background:var(--bg);color:var(--text)}
.modal-btns{display:flex;gap:12px;margin-top:10px}
.btn-cancel{background:transparent;color:var(--sub);border:1px solid var(--bor);padding:12px;border-radius:10px;flex:1}
.theme-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.theme-opt{padding:10px;border-radius:8px;border:2px solid var(--bor);cursor:pointer;text-align:center;font-size:11px;font-weight:600}
</style>
</head>
<body>

<header class="header">
  <div style="display:flex;gap:12px;align-items:center">
    <img id="logoHeader" style="width:42px;height:42px;border-radius:10px;object-fit:cover;display:none">
    <div id="logoPh" style="width:42px;height:42px;background:var(--bg);border:1px solid var(--bor);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px">🔧</div>
    <div><h1 id="nombreLocal" style="font-size:16px">Mi Taller</h1><small id="nombreTec" style="font-size:11px;color:var(--sub)">Técnico</small></div>
  </div>
</header>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="nav('dash', this)">📊<span>Inicio</span></button>
  <button class="nav-btn" onclick="nav('cli', this)">👥<span>Clientes</span></button>
  <button class="nav-btn" onclick="nav('ord', this)">📋<span>Órdenes</span></button>
  <button class="nav-btn" onclick="nav('ajus', this)">⚙️<span>Ajustes</span></button>
</nav>

<main id="view-dash" class="view active"><h2>Bienvenida 👋</h2><div class="card" style="margin-top:20px"><h3>Ingresos Hoy</h3><p style="font-size:24px;color:var(--prim)">$0</p></div></main>

<main id="view-cli" class="view">
  <div style="display:flex;justify-content:space-between;margin-bottom:20px"><h2>Clientes</h2><button class="btn-main" onclick="modal('mCli')">+ Nuevo</button></div>
  <div id="listaCli"></div>
</main>

<main id="view-ord" class="view">
  <div style="display:flex;justify-content:space-between;margin-bottom:20px"><h2>Órdenes</h2><button class="btn-main" onclick="modal('mOrd')">+ Nueva</button></div>
  <div id="listaOrd"></div>
</main>

<main id="view-ajus" class="view">
  <h2>⚙️ Ajustes</h2>
  <div class="card" style="margin-top:20px">
    <label>Nombre Local<input type="text" id="inNegocio"></label>
    <label>WhatsApp<input type="tel" id="inTel"></label>
    <label>Logo (Galería)<input type="file" id="inLogo" accept="image/*" onchange="subirLogo(event)"></label>
    <img id="prevLogo" style="max-width:100px;border-radius:10px;margin-top:10px;display:none">
    <button class="btn-main" style="margin-top:15px;width:100%" onclick="guardarAjustes()">Guardar Ajustes</button>
  </div>
  <div class="card">
    <h3>Tema de Colores</h3>
    <div class="theme-grid">
      <div class="theme-opt" onclick="setTema('oscuro-rojo')">Negro/Rojo</div>
      <div class="theme-opt" onclick="setTema('claro-rojo')">Blanco/Rojo</div>
      <div class="theme-opt" onclick="setTema('claro-turquesa')">Blanco/Turquesa</div>
    </div>
  </div>
</main>

<div id="mCli" class="modal"><div class="modal-content">
  <h3>Cliente</h3><input type="text" id="cNom" placeholder="Nombre"><input type="tel" id="cTel" placeholder="Teléfono">
  <div class="modal-btns"><button class="btn-cancel" onclick="cerrar('mCli')">Cancelar</button><button class="btn-main" style="flex:1" onclick="guardarCliente()">Guardar</button></div>
</div></div>

<div id="mOrd" class="modal"><div class="modal-content">
  <h3>Orden</h3><select id="oCli"></select><input type="text" id="oEq" placeholder="Equipo"><input type="number" id="oCosto" placeholder="Costo">
  <div class="modal-btns"><button class="btn-cancel" onclick="cerrar('mOrd')">Cancelar</button><button class="btn-main" style="flex:1" onclick="guardarOrden()">Guardar</button></div>
</div></div>

<script>
let D = JSON.parse(localStorage.getItem('tp_db')) || { config: { negocio:'Mi Taller', tecnico:'Técnico', tel:'', logo:'' }, clientes: [], ordenes: [] };

function init() {
  setTema(localStorage.getItem('tp_tema') || 'oscuro-rojo');
  render();
}

function setTema(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('tp_tema', t);
}

function nav(v, btn) {
  document.querySelectorAll('.view').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(x => x.classList.remove('active'));
  document.getElementById('view-' + v).classList.add('active');
  btn.classList.add('active');
}

function modal(id) { document.getElementById(id).classList.add('active'); }
function cerrar(id) { document.getElementById(id).classList.remove('active'); }

function subirLogo(e) {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ev => { document.getElementById('prevLogo').src = ev.target.result; document.getElementById('prevLogo').style.display = 'block'; };
  r.readAsDataURL(f);
}

function guardarAjustes() {
  D.config.negocio = document.getElementById('inNegocio').value || 'Mi Taller';
  D.config.tel = document.getElementById('inTel').value;
  const img = document.getElementById('prevLogo');
  if (img.src && img.style.display !== 'none') D.config.logo = img.src;
  localStorage.setItem('tp_db', JSON.stringify(D));
  render(); alert('Ajustes Guardados');
}

function guardarCliente() {
  const n = document.getElementById('cNom').value;
  if(!n) return alert('Falta el nombre');
  D.clientes.push({ id: Date.now(), nombre: n, tel: document.getElementById('cTel').value });
  localStorage.setItem('tp_db', JSON.stringify(D));
  cerrar('mCli'); render();
}

function guardarOrden() {
  const e = document.getElementById('oEq').value;
  if(!e) return alert('Falta el equipo');
  D.ordenes.push({ id: Date.now(), equipo: e, costo: parseFloat(document.getElementById('oCosto').value)||0, cliId: document.getElementById('oCli').value });
  localStorage.setItem('tp_db', JSON.stringify(D));
  cerrar('mOrd'); render();
}

function render() {
  document.getElementById('nombreLocal').textContent = D.config.negocio;
  document.getElementById('nombreTec').textContent = D.config.tecnico || 'Técnico';
  if(D.config.logo) {
    document.getElementById('logoHeader').src = D.config.logo;
    document.getElementById('logoHeader').style.display = 'block';
    document.getElementById('logoPh').style.display = 'none';
  }
  
  document.getElementById('inNegocio').value = D.config.negocio;
  document.getElementById('inTel').value = D.config.tel || '';
  if(D.config.logo) {
    document.getElementById('prevLogo').src = D.config.logo;
    document.getElementById('prevLogo').style.display = 'block';
  }

  document.getElementById('listaCli').innerHTML = D.clientes.length ? D.clientes.map(c => `<div class="card"><b>${c.nombre}</b><p style="color:var(--sub);font-size:13px">${c.tel}</p></div>`).join('') : '<p style="color:var(--sub)">No hay clientes</p>';
  
  document.getElementById('listaOrd').innerHTML = D.ordenes.length ? D.ordenes.map(o => {
    const c = D.clientes.find(x => x.id == o.cliId);
    return `<div class="card"><b>${o.equipo}</b><p style="color:var(--sub);font-size:13px">Cliente: ${c ? c.nombre : 'Sin cliente'}</p><p style="font-size:14px;margin-top:5px;color:var(--acc)">$${o.costo}</p></div>`;
  }).join('') : '<p style="color:var(--sub)">No hay órdenes</p>';
  
  document.getElementById('oCli').innerHTML = D.clientes.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
}

init();
</script>
</body>
</html>
