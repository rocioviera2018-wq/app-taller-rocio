<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechPro Manager</title>
<style>
:root { --bg: #09090B; --card: #18181B; --text: #FAFAFA; --text-sub: #A1A1AA; --primary: #E11D48; --accent: #06B6D4; --border: #27272A; }
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);padding-bottom:80px}
.header{background:var(--card);padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid var(--border)}
.btn-main{background:var(--primary);color:#FFF;border:none;padding:10px 18px;border-radius:10px;font-weight:600;cursor:pointer;font-size:14px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:space-around;padding:12px 0 20px 0;border-top:1px solid var(--border)}
.nav-btn{background:none;border:none;display:flex;flex-direction:column;align-items:center;font-size:20px;color:var(--text-sub);cursor:pointer;flex:1}
.nav-btn span{font-size:10px;margin-top:4px;font-weight:600}
.nav-btn.active{color:var(--accent)}
.view{display:none;padding:20px 16px;max-width:700px;margin:0 auto}
.view.active{display:block}
.card{background:var(--card);padding:16px;border-radius:12px;border:1px solid var(--border);margin-bottom:12px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:flex-end;justify-content:center}
.modal.active{display:flex}
.modal-content{background:var(--card);width:100%;max-width:600px;padding:24px;border-radius:24px 24px 0 0}
.modal-content input{width:100%;padding:14px;border:1px solid var(--border);border-radius:10px;margin-top:8px;background:var(--bg);color:var(--text);margin-bottom:15px}
.modal-btns{display:flex;gap:12px;margin-top:20px}
.btn-cancel{background:transparent;color:var(--text-sub);border:1px solid var(--border);padding:12px;border-radius:10px;flex:1}
</style>
</head>
<body>
<header class="header"><h2>Mi Taller</h2></header>
<nav class="bottom-nav">
  <button class="nav-btn active" data-view="dashboard">📊<span>Inicio</span></button>
  <button class="nav-btn" data-view="clientes">👥<span>Clientes</span></button>
</nav>
<main id="view-dashboard" class="view active"><h2>Bienvenida Rocío 👋</h2><p style="color:var(--text-sub);margin-top:10px">Prueba de funcionamiento</p></main>
<main id="view-clientes" class="view">
  <div style="display:flex;justify-content:space-between;margin-bottom:20px"><h2>Clientes</h2><button class="btn-main" onclick="abrirModal()">+ Nuevo</button></div>
  <div id="listaClientes"></div>
</main>
<div id="modalCliente" class="modal"><div class="modal-content">
  <h3>Nuevo Cliente</h3>
  <label>Nombre<input type="text" id="nombre"></label>
  <label>Teléfono<input type="tel" id="telefono"></label>
  <div class="modal-btns"><button class="btn-cancel" onclick="cerrarModal()">Cancelar</button><button class="btn-main" style="flex:1" onclick="guardarCliente()">Guardar</button></div>
</div></div>
<script>
let clientes = JSON.parse(localStorage.getItem('clientes_prueba')) || [];
document.querySelectorAll('.nav-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
  };
});
function render() {
  document.getElementById('listaClientes').innerHTML = clientes.length ? clientes.map(c => `<div class="card"><b>${c.nombre}</b><p style="color:var(--text-sub);font-size:13px">${c.telefono}</p></div>`).join('') : '<p style="color:var(--text-sub)">No hay clientes guardados</p>';
}
function abrirModal(){ document.getElementById('nombre').value=''; document.getElementById('telefono').value=''; document.getElementById('modalCliente').classList.add('active'); }
function cerrarModal(){ document.getElementById('modalCliente').classList.remove('active'); }
function guardarCliente(){
  const n = document.getElementById('nombre').value;
  if(!n) return alert('Escribe un nombre');
  clientes.push({nombre: n, telefono: document.getElementById('telefono').value});
  localStorage.setItem('clientes_prueba', JSON.stringify(clientes));
  cerrarModal(); render(); alert('¡Guardado en el celular!');
}
render();
</script>
</body>
</html>
